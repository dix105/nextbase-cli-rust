<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisper</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --card: #f9fafb;
    --accent: #2563eb;
    --ok: #059669;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e8ec; --muted: #9aa1ad;
      --line: #23262e; --card: #16181d; --accent: #60a5fa;
      --ok: #34d399; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .status {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 24px;
  }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .tile .v { font-size: 14px; margin-top: 3px; font-weight: 500; word-break: break-word; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--muted); }
  .dot.warn { background: var(--warn); }
  .bar { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type=search] {
    flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: inherit;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .count { color: var(--muted); font-size: 13px; align-self: center; white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px;
    margin-bottom: 8px; background: var(--card);
  }
  .meta { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 5px; }
  time, .src { color: var(--muted); font-size: 12px; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }

  /* Meeting Agent panel */
  .panel {
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    padding: 14px 16px; margin-bottom: 24px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 2px; }
  .panel .note { color: var(--muted); font-size: 12px; }
  .panel .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .panel button.primary { border-color: var(--accent); color: var(--accent); font-size: 13px; padding: 6px 14px; }
  .panel button.danger { border-color: var(--warn); color: var(--warn); }
  .panel button:disabled { opacity: 0.45; cursor: not-allowed; }
  .elapsed { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .levels { display: grid; gap: 6px; margin-top: 10px; }
  .level { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width 120ms linear; }
  .level.silent .meter > i { background: var(--warn); }
  .candidates { display: grid; gap: 10px; margin-top: 12px; }
  .candidate { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  .candidate h3 { font-size: 13px; margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, monospace; }
  .facts { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .excerpt {
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 180px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .warnbox {
    border-left: 3px solid var(--warn); padding: 6px 10px; margin-top: 10px;
    font-size: 12px; color: var(--fg); background: color-mix(in srgb, var(--warn) 8%, transparent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Wisper</h1><span class="sub" id="listener"></span></header>
  <div class="sub">Local dashboard. Nothing here leaves your machine.</div>

  <div class="panel" id="meeting" hidden></div>

  <div class="status" id="status"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search transcripts" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No transcripts yet. Hold your shortcut and speak.</div>
</div>

<script>
const escapeHtml = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let history = [];

function tile(k, v, dot) {
  return `<div class="tile"><div class="k">${escapeHtml(k)}</div><div class="v">${
    dot ? `<span class="dot ${dot}"></span>` : ''}${escapeHtml(v)}</div></div>`;
}

function renderStatus(state) {
  const s = state.setup;
  document.getElementById('status').innerHTML = [
    tile('Provider', s.provider || 'not set', s.provider ? 'on' : 'off'),
    tile('Model', s.model || 'not set'),
    tile('Dictation', s.shortcut),
    tile('Polish', s.polishShortcut),
    tile('Spell fix', s.spellShortcut),
    tile('Auto polish', s.autoPolish ? 'on' : 'off', s.autoPolish ? 'on' : 'off'),
  ].join('');

  const el = document.getElementById('listener');
  if (state.listeners === 1) el.innerHTML = '<span class="dot on"></span>listener running';
  else if (state.listeners === 0) el.innerHTML = '<span class="dot off"></span>listener stopped';
  else el.innerHTML = `<span class="dot warn"></span>${state.listeners} listeners running`;
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = q ? history.filter((h) => h.text.toLowerCase().includes(q)) : history;

  document.getElementById('count').textContent =
    q ? `${rows.length} of ${history.length}` : `${history.length} total`;
  document.getElementById('empty').hidden = history.length !== 0;

  document.getElementById('list').innerHTML = rows.map((item) => `
    <li>
      <div class="meta">
        <time>${escapeHtml(new Date(item.createdAt).toLocaleString())}</time>
        <div class="row">
          <button data-copy="${escapeHtml(item.id)}">Copy</button>
          <button data-delete="${escapeHtml(item.id)}">Delete</button>
        </div>
      </div>
      <div class="text">${escapeHtml(item.text)}</div>
    </li>`).join('');
}

// ---------------------------------------------------------------- Meeting

const clock = (seconds) => {
  const total = Math.max(0, Math.round(seconds || 0));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
};

const PHASE_TEXT = {
  'starting': 'Opening the microphone and system audio',
  'recording': 'Recording',
  'stopping': 'Finalizing the recording',
  'recorded': 'Recorded, not yet transcribed',
  'sampling': 'Transcribing a sample in both modes',
  'awaiting-approval': 'Waiting for you to pick a mode',
  'transcribing': 'Transcribing the full recording',
  'summarising': 'Writing the summary and action items',
  'done': 'Finished',
  'failed': 'Failed',
};

function levelRow(level) {
  // Scaled by RMS rather than peak: a single click would otherwise peg the meter.
  const width = Math.min(100, Math.round((level.rms || 0) * 900));
  return `<div class="level${level.silent ? ' silent' : ''}">
    <span>${escapeHtml(level.source)}</span>
    <span class="meter"><i style="width:${width}%"></i></span>
    <span>${level.silent ? 'silent' : `peak ${(level.peak || 0).toFixed(3)}`}</span>
  </div>`;
}

function candidateCard(candidate) {
  if (candidate.error) {
    return `<div class="candidate"><h3>${escapeHtml(candidate.mode)}</h3>
      <div class="facts">Failed: ${escapeHtml(candidate.error)}</div></div>`;
  }
  const coverage = candidate.coveredSeconds == null
    ? 'no timestamps returned'
    : `${clock(candidate.coveredSeconds)} of ${clock(candidate.sampleSeconds)}`;
  return `<div class="candidate">
    <h3>${escapeHtml(candidate.mode)}</h3>
    <div class="facts">
      took ${clock(candidate.elapsedSeconds)} &middot; coverage ${escapeHtml(coverage)} &middot;
      ${candidate.segmentCount} segments, ${candidate.speakerLabels} generic label(s),
      ${candidate.overlappingSegments} overlapping &middot;
      language detected: ${escapeHtml(candidate.detectedLanguage || 'not reported')}
    </div>
    <div class="excerpt">${escapeHtml(candidate.text || '(empty)')}</div>
    <div class="actions">
      <button class="primary" data-approve="${escapeHtml(candidate.mode)}">Use ${escapeHtml(candidate.mode)}</button>
    </div>
  </div>`;
}

function renderMeeting(meeting) {
  const panel = document.getElementById('meeting');

  if (!meeting.active) {
    panel.hidden = false;
    panel.innerHTML = `<h2>Meeting Agent</h2>
      <div class="note">No meeting in progress.</div>
      ${meeting.unfinished ? `<div class="warnbox">${meeting.unfinished} recorded meeting(s)
        were never transcribed. Finish with <code>nbmeet process</code>.</div>` : ''}
      <div class="actions"><button class="primary" data-meeting="start">Start recording</button></div>`;
    return;
  }

  panel.hidden = false;
  const phase = PHASE_TEXT[meeting.phase] || meeting.phase;
  const levels = (meeting.sourceLevels || []).map(levelRow).join('');
  const silent = (meeting.sourceLevels || []).filter((l) => l.silent);

  let body = `<h2>Meeting Agent</h2>
    <div class="note">${escapeHtml(meeting.id)} &middot; ${escapeHtml(phase)}</div>`;

  if (meeting.capturing) {
    body += `<div class="elapsed">${clock(meeting.elapsedSeconds)}</div>
      <div class="note">${meeting.onDiskSeconds != null
        ? `${clock(meeting.onDiskSeconds)} safely written to disk`
        : 'starting'}</div>
      <div class="actions">
        <button class="primary" data-meeting="stop"${meeting.phase === 'stopping' ? ' disabled' : ''}>
          ${meeting.phase === 'stopping' ? 'Stopping…' : 'Stop and transcribe'}</button>
      </div>`;
  } else if (meeting.recordedSeconds != null) {
    body += `<div class="elapsed">${clock(meeting.recordedSeconds)}</div>`;
  }

  if (levels) body += `<div class="levels">${levels}</div>`;
  for (const level of silent) {
    body += `<div class="warnbox"><strong>${escapeHtml(level.source)}</strong> was silent for the
      whole recording, so anything from that side is missing from the transcript.</div>`;
  }

  if (meeting.processing) {
    body += `<div class="note" style="margin-top:10px">This can take several minutes — Sarvam
      Batch jobs queue. Safe to close this tab; it keeps running.</div>`;
  }

  if (meeting.phase === 'awaiting-approval' && meeting.sample) {
    const sample = meeting.sample;
    body += `<div class="note" style="margin-top:12px">
      Sample: ${clock(sample.windowSeconds)} from ${clock(sample.windowStartSeconds)},
      RMS ${(sample.windowRms || 0).toFixed(4)}</div>`;
    if ((sample.windowRms || 0) < 0.005) {
      body += `<div class="warnbox">That window is nearly silent, so neither transcript
        means much.</div>`;
    }
    body += `<div class="candidates">${(sample.candidates || []).map(candidateCard).join('')}</div>
      <div class="warnbox">Speaker labels are generic, not people. Language detection says which
        language was heard, not whether the words are right. Check names and numbers against the
        audio.</div>
      <div class="actions"><button class="danger" data-meeting="reject">Reject — do not
        transcribe</button></div>`;
  }

  if (meeting.phase === 'recorded') {
    body += `<div class="actions"><button class="primary" data-meeting="process">Transcribe
      it</button></div>`;
  }
  if (meeting.error) {
    body += `<div class="warnbox">${escapeHtml(meeting.error)}</div>`;
  }

  panel.innerHTML = body;
}

async function post(path) {
  const response = await fetch(path, { method: 'POST' });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    alert(body.error || `Request failed: HTTP ${response.status}`);
  }
  await refresh();
}

async function refreshState() {
  const state = await (await fetch('/api/state')).json();
  history = state.history;
  renderStatus(state);
  renderList();
}

async function refreshMeeting() {
  renderMeeting(await (await fetch('/api/meeting')).json());
}

async function refresh() {
  await Promise.all([refreshState(), refreshMeeting()]);
}

document.getElementById('q').addEventListener('input', renderList);

document.addEventListener('click', async (event) => {
  const copy = event.target.closest('[data-copy]');
  if (copy) {
    const item = history.find((h) => h.id === copy.dataset.copy);
    await navigator.clipboard.writeText(item.text);
    copy.textContent = 'Copied';
    setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
    return;
  }

  const del = event.target.closest('[data-delete]');
  if (del) {
    await fetch(`/api/history/${encodeURIComponent(del.dataset.delete)}`, { method: 'DELETE' });
    await refresh();
    return;
  }

  const approve = event.target.closest('[data-approve]');
  if (approve) {
    approve.disabled = true;
    await post(`/api/meeting/approve/${encodeURIComponent(approve.dataset.approve)}`);
    return;
  }

  const action = event.target.closest('[data-meeting]');
  if (action) {
    action.disabled = true;
    // `process` reuses the stop endpoint's hand-off: both mean "take it from here".
    const route = action.dataset.meeting === 'process' ? 'stop' : action.dataset.meeting;
    await post(`/api/meeting/${route}`);
  }
});

refresh();
// A recording needs a live clock, but /api/state enumerates every process to count
// listeners — far too expensive to run every second. Two intervals, not one.
setInterval(refreshMeeting, 1000);
setInterval(refreshState, 4000);
</script>
</body>
</html>
