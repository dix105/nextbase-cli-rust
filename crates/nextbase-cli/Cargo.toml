[package]
name = "nextbase-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nextbase"
path = "src/bin/nextbase.rs"

[[bin]]
name = "wisper"
path = "src/bin/wisper.rs"

[[bin]]
name = "nbmeet"
path = "src/bin/nbmeet.rs"

[dependencies]
nextbase-core = { path = "../nextbase-core" }
nextbase-meeting = { path = "../nextbase-meeting" }
anyhow.workspace = true
serde_json.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
indicatif = "0.17"
owo-colors = "4"
ratatui = "0.29"
anstream = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
