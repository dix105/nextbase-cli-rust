name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug info is expensive to generate and link, and nothing here debugs CI
  # artifacts. Set as env rather than in Cargo.toml so local builds keep it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting compiles nothing, so it runs on the cheapest, fastest runner.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # clippy and test are split so they run concurrently instead of one after the
  # other. On Windows that was 168s + 182s serialised.
  check:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the only check the Windows hotkey, paste and autostart
        # code gets: rustls pulls in `ring`, whose build script needs a Windows C
        # toolchain, so it cannot be cross-compiled from macOS.
        os: [macos-latest, windows-latest]
        task: [clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Otherwise both tasks on one OS fight over a single cache entry and
          # keep invalidating each other.
          key: ${{ matrix.task }}
      - if: matrix.task == 'clippy'
        run: cargo clippy --all-targets -- -D warnings
      - if: matrix.task == 'test'
        run: cargo test --all

  # A release build is 449s on Windows, so it is not worth paying on every push.
  # The release workflow builds the real artifacts on a v* tag; this only guards
  # against something that breaks solely under optimisation.
  release-build:
    name: release build (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
